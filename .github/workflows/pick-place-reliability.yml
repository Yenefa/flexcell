# Manual, explicitly triggered workflow. Shares the physical-capabilities
# concurrency group so two simulators never run at once.
name: pick-place-reliability
on:
  workflow_dispatch:
concurrency:
  group: physical-capabilities
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  pick-place-window:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.sim
          load: true
          tags: flexcell-sim:pr
          build-args: SOURCE_REV=${{ github.sha }}
          cache-from: type=gha,scope=flexcell-sim
          cache-to: type=gha,mode=max,scope=flexcell-sim
      - name: Offline driver and aggregator tests (no simulator)
        run: |
          docker run --init --rm flexcell-sim:pr \
            python3 -m unittest discover -s /opt/flexcell/repo/experiments/physical_capabilities/pick_place_reliability/tests -v
      - name: One frozen four-slot window
        run: |
          mkdir -p artifacts
          docker run --init --rm --cpus=2 -v "$PWD/artifacts:/artifacts" flexcell-sim:pr \
            python3 /opt/flexcell/repo/experiments/physical_capabilities/pick_place_reliability/run_window.py \
            --out /artifacts/pick-place
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pick-place-reliability-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
