name: compact-stroke-evidence
on:
  push:
    paths:
      - '.github/workflows/compact-stroke-evidence.yml'
      - 'setup/acceptance/physical_compact_stroke_20261117/archive.json'
      - 'setup/acceptance/physical_compact_stroke_20261117/verify_archive.py'
      - 'setup/acceptance/physical_compact_stroke_20261117/raw-44167822674.zip'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python3 setup/acceptance/physical_compact_stroke_20261117/verify_archive.py \
            setup/acceptance/physical_compact_stroke_20261117/raw-44167822674.zip /tmp/compact-stroke-replay
