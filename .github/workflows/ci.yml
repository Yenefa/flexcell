# FlexCell CI (audit P3): the offline test ladder runs on every push/PR.
#
# Scope: build + test the TWO first-party packages offline (no simulator).
# The runtime/acceptance batteries stay on the delivery machines (they need
# Gazebo + the world; see REPRODUCE.md).  Steps mirror the proven local
# ladder: colcon build -> colcon test (all suites, 0 failures required) ->
# static ghost-attribute scan.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install test deps
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y -qq \
            python3-pytest python3-jsonschema \
            ros-jazzy-moveit-msgs \
            ros-jazzy-control-msgs \
            ros-jazzy-tf2-ros \
            ros-jazzy-ros2-control \
            ros-jazzy-joint-state-broadcaster \
            ros-jazzy-joint-trajectory-controller > /dev/null

      - name: frozen desktop delivery audit (incomplete evidence is expected)
        shell: bash
        run: |
          set +e
          python3 setup/audit_desktop_delivery.py \
            setup/acceptance/desktop_delivery_20261023/original-delivery.zip \
            --out /tmp/desktop-delivery-audit.json
          audit_rc=$?
          set -e
          test "$audit_rc" -eq 2
          python3 - <<'PY'
          import json
          report = json.load(open('/tmp/desktop-delivery-audit.json'))
          assert report['raw_export_consistency'] == 'PASS'
          assert report['rows'] == 176
          assert report['original_schema_errors'] == 176
          assert report['corrected_schema_errors'] == 0
          assert report['native_episode_files'] == 0
          assert report['status'] == 'INCOMPLETE_EVIDENCE'
          PY

      - name: E-021 native recovery verification (#31)
        shell: bash
        run: |
          python3 setup/acceptance/e021_native_recovery_20261024/verify_recovery.py
          python3 setup/acceptance/e021_native_recovery_20261024/selftest_verify_recovery.py
          python3 setup/acceptance/e021_native_recovery_20261024/decision_audit.py

      - name: issue #22 re-adjudication (#31 item 6)
        shell: bash
        run: |
          python3 setup/acceptance/issue22_readjudication_20261024/verify_issue22_claims.py
          python3 setup/acceptance/issue22_readjudication_20261024/selftest_verify_issue22.py

      - name: GRASP-B-001 window verification (#32)
        shell: bash
        run: |
          python3 setup/acceptance/grasp_b001_20261025/verify_grasp_b001.py
          python3 setup/acceptance/grasp_b001_20261025/selftest_verify_grasp_b001.py

      - name: GRASP-B-001 sequence analysis (#32)
        shell: bash
        run: |
          python3 setup/acceptance/grasp_sequence_20261025/analyse.py
          python3 setup/acceptance/grasp_sequence_20261025/selftest_analyse.py

      - name: build (first-party packages)
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install \
            --packages-select flexcell_interfaces flexcell_skills

      - name: colcon test (all suites, 0 failures required)
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --packages-select flexcell_skills
          colcon test-result --verbose
          colcon test-result || exit 1

      - name: static ghost-attribute scan
        shell: bash
        run: |
          python3 setup/82_undefined_attr_check.py src/flexcell

      # Needs the built package on PYTHONPATH (replay_episode + FSMPolicy), so it
      # runs after the build rather than with the other archive checkers.
      - name: replay drift probe (semantic vs textual)
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 setup/acceptance/replay_drift_20261024/probe_replay_drift.py
