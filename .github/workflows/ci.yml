# FlexCell CI (audit P3): the offline test ladder runs on every push/PR.
#
# Scope: build + test the TWO first-party packages offline (no simulator).
# The runtime/acceptance batteries stay on the delivery machines (they need
# Gazebo + the world; see REPRODUCE.md).  Steps mirror the proven local
# ladder: colcon build -> colcon test (all suites, 0 failures required) ->
# static ghost-attribute scan.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: transfer-cost ledger (stdlib only, no robot)
        run: python3 -m unittest discover -s setup/transferbench -p 'test_*.py' -v

      - name: install test deps
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y -qq \
            python3-pytest \
            ros-jazzy-moveit-msgs \
            ros-jazzy-control-msgs \
            ros-jazzy-tf2-ros \
            ros-jazzy-ros2-control \
            ros-jazzy-joint-state-broadcaster \
            ros-jazzy-joint-trajectory-controller > /dev/null

      - name: build (first-party packages)
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install \
            --packages-select flexcell_interfaces flexcell_skills

      - name: colcon test (all suites, 0 failures required)
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --packages-select flexcell_skills
          colcon test-result --verbose
          colcon test-result || exit 1

      - name: static ghost-attribute scan
        shell: bash
        run: |
          python3 setup/82_undefined_attr_check.py src/flexcell
