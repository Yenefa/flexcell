name: physical-reachable-contact
on:
  push:
    branches: [develop/physical-capabilities-20261113]
    paths:
      - '.github/workflows/physical-reachable-contact.yml'
      - 'experiments/physical_capabilities/t08_reachable_contact_20261113/run_window.py'
      - 'experiments/physical_capabilities/t08_reachable_contact_20261113/preregistration.json'
      - 'experiments/physical_capabilities/t08_reachable_contact_20261113/source_freeze.json'
      - 'experiments/physical_capabilities/t08_reachable_contact_20261113/probe.schema.json'
      - 'experiments/physical_capabilities/t08_reachable_contact_20261113/tasks/*.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: physical-capabilities
  cancel-in-progress: false
jobs:
  candidate-window:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.sim
          load: true
          tags: flexcell-sim:position-contact
          build-args: SOURCE_REV=${{ github.sha }}
          cache-from: type=gha,scope=flexcell-sim
      - name: Image provenance
        run: |
          mkdir -p artifacts
          docker image inspect flexcell-sim:position-contact > artifacts/image.json
          lscpu > artifacts/host.txt
      - name: Existing task and new geometry contracts
        run: |
          docker run --init --rm -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 flexcell-sim:position-contact \
            python3 -m pytest -p no:cacheprovider -o addopts="" -q \
            /opt/flexcell/repo/src/flexcell/flexcell_capabilities/test \
            /opt/flexcell/repo/src/flexcell/flexcell_skills/test/test_contact_control.py \
            /opt/flexcell/repo/src/flexcell/flexcell_skills/test/test_public_contact_runtime.py \
            /opt/flexcell/repo/src/flexcell/flexcell_skills/test/test_push_results.py \
            /opt/flexcell/repo/src/flexcell/flexcell_skills/test/test_push_composite.py \
            /opt/flexcell/repo/src/flexcell/flexcell_skills/test/test_composite_server.py \
            /opt/flexcell/repo/src/flexcell/flexcell_skills/test/test_composite.py \
            /opt/flexcell/repo/src/flexcell/flexcell_skills/test/test_budget_lifecycle.py
      - name: Fixed candidate validation against the observed reach failure
        run: |
          docker run --init --rm --cpus=2 --shm-size=512m \
            -v "$PWD:/candidate:ro" -v "$PWD/artifacts:/artifacts" \
            -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 flexcell-sim:position-contact \
            python3 /candidate/experiments/physical_capabilities/t08_reachable_contact_20261113/run_window.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physical-reachable-contact-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
