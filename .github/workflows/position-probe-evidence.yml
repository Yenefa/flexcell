name: position-probe-evidence
on:
  push:
    paths:
      - '.github/workflows/position-probe-evidence.yml'
      - 'setup/acceptance/physical_position_contact_20261113/archive.json'
      - 'setup/acceptance/physical_position_contact_20261113/verify_archive.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install jsonschema
      - run: |
          python3 setup/acceptance/physical_position_contact_20261113/verify_archive.py \
            setup/acceptance/physical_position_contact_20261113/raw-43448943203.zip /tmp/position-probe-replay
