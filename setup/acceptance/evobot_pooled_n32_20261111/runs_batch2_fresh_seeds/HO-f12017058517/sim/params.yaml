    enforce_orientation: false
    planning_constraint_radius_m: 0.008
    workspace_min:
    - -0.45
    - -0.45
    - -0.15
    workspace_max:
    - 0.45
    - 0.45
    - 0.75
    motion_profile_names:
    - demo_veryslow
    - demo_slow
    - demo_default
    motion_profile_demo_veryslow_max_velocity: 0.05
    motion_profile_demo_veryslow_max_acceleration: 0.05
    motion_profile_demo_slow_max_velocity: 0.2
    motion_profile_demo_slow_max_acceleration: 0.2
    motion_profile_demo_default_max_velocity: 0.5
    motion_profile_demo_default_max_acceleration: 0.5
    default_motion_profile: demo_slow
    log_dir: /tmp/evobot-pair32/HO-f12017058517/sim/skills
    log_file: move_to_pose.jsonl
    enable_mtc_handoff: false
