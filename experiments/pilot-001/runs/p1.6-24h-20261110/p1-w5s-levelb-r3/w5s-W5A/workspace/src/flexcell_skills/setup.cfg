[develop]
script_dir=$base/lib/flexcell_skills
[install]
install_scripts=$base/lib/flexcell_skills

[tool:pytest]
# audit P1-4: the offline suites are part of `colcon test` now - they run on
# every build, not only when someone remembers to invoke them by hand.
testpaths = test
python_files = test_*.py
addopts = -q
