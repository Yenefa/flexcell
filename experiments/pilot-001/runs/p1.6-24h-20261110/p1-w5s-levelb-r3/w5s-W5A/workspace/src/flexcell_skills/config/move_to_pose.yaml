move_to_pose_server:
  ros__parameters:
    use_sim_time: true

    # --- MoveIt wiring ---
    planning_group: arm
    end_effector_link: end_effector_link
    base_frame: world
    planning_service: /plan_kinematic_path
    ik_service: /compute_ik
    execute_action: /execute_trajectory
    # Verified cancellable path. MoveIt 2.12.4's /execute_trajectory accepts
    # cancel requests but never acts on them (see docs/DAY2_MOVETOPOSE.md).
    execution_backend: controller_action
    controller_action: /arm_controller/follow_joint_trajectory
    joint_states_topic: /joint_states

    # --- time budgets (server owns the hard bounds) ---
    default_deadline_ms: 20000
    max_deadline_ms: 60000
    planning_timeout_s: 5.0
    ik_timeout_s: 1.0
    execution_timeout_s: 25.0
    tf_timeout_s: 1.0
    stop_confirm_timeout_s: 4.0
    stop_result_timeout_s: 12.0
    cut_short_threshold_rad: 0.02
    stop_velocity_epsilon: 0.02
    joint_state_max_age_s: 1.0

    # --- success criteria (measured from real state, not from MoveIt) ---
    position_tolerance_m: 0.02
    orientation_tolerance_rad: 0.35
    # The shipped OpenMANIPULATOR-X KDL config sets position_only_ik: true,
    # so orientation is NOT enforced by IK. Reported explicitly in the result.
    enforce_orientation: false
    planning_constraint_radius_m: 0.008

    # --- workspace boundary (base_frame, metres) ---
    workspace_min: [-0.45, -0.45, -0.15]
    workspace_max: [0.45, 0.45, 0.75]

    # --- motion profile whitelist (callers never supply raw scaling) ---
    motion_profile_names: ["demo_veryslow", "demo_slow", "demo_default"]
    motion_profile_demo_veryslow_max_velocity: 0.05
    motion_profile_demo_veryslow_max_acceleration: 0.05
    motion_profile_demo_slow_max_velocity: 0.2
    motion_profile_demo_slow_max_acceleration: 0.2
    motion_profile_demo_default_max_velocity: 0.5
    motion_profile_demo_default_max_acceleration: 0.5
    default_motion_profile: demo_slow

    # --- structured logging ---
    log_dir: ~/.ros/flexcell
    log_file: move_to_pose.jsonl
