observe_server:
  ros__parameters:
    use_sim_time: true
    tracked_objects: ["target_box"]
    object_target_box_size: [0.035, 0.035, 0.035]
    move_epsilon_m: 0.002
    base_frame: world
    end_effector_link: end_effector_link
    joint_states_topic: /joint_states
    world_state_topic: /flexcell/world_state
    attach_topic: /flexcell/target_box/attach
    log_dir: ~/.ros/flexcell
    log_file: observe.jsonl

pick_server:
  ros__parameters:
    use_sim_time: true
    move_to_pose_action: /move_to_pose
    gripper_action: /gripper_controller/gripper_cmd
    gripper_open_position: 0.02
    gripper_close_position: -0.011
    approach_hover_m: 0.22
    grasp_dz_m: 0.16
    grasp_raise_m: 0.10
    attach_radius_m: 0.20
    carry_start_topic: /flexcell/carry_start
    carry_stop_topic: /flexcell/carry_stop
    box_follow_min_m: 0.03
    object_size: [0.035, 0.035, 0.035]
    base_frame: world
    end_effector_link: end_effector_link
    default_deadline_ms: 30000
    motion_profile_names: ["demo_veryslow", "demo_slow", "demo_default"]
    default_motion_profile: demo_slow
    log_dir: ~/.ros/flexcell
    log_file: pick.jsonl

place_server:
  ros__parameters:
    use_sim_time: true
    move_to_pose_action: /move_to_pose
    gripper_action: /gripper_controller/gripper_cmd
    gripper_open_position: 0.02
    release_hover_m: 0.10
    release_clearance_m: 0.012
    carry_offset_m: 0.16
    place_tolerance_m: 0.06
    settle_time_s: 1.0
    retreat_m: 0.10
    carry_stop_topic: /flexcell/carry_stop
    object_size: [0.035, 0.035, 0.035]
    default_deadline_ms: 30000
    motion_profile_names: ["demo_veryslow", "demo_slow", "demo_default"]
    default_motion_profile: demo_slow
    log_dir: ~/.ros/flexcell
    log_file: place.jsonl

verify_server:
  ros__parameters:
    use_sim_time: true
    default_tolerance_m: 0.05
    log_dir: ~/.ros/flexcell
    log_file: verify.jsonl

carry_server:
  ros__parameters:
    use_sim_time: true
    world: empty
    model: target_box
    carry_period_s: 0.1
    base_frame: world
    end_effector_link: end_effector_link
    start_topic: /flexcell/carry_start
    stop_topic: /flexcell/carry_stop
    log_dir: ~/.ros/flexcell
    log_file: carry.jsonl

task_fsm_server:
  ros__parameters:
    use_sim_time: true
    observe_action: /observe
    pick_action: /pick_object
    place_action: /place_object
    verify_action: /verify_object
    default_place_tolerance_m: 0.06
    skill_wait_s: 90.0
    log_dir: ~/.ros/flexcell
    log_file: task_fsm.jsonl
